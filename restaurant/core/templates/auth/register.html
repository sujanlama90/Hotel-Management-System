<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- cdn bootsrap css link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
    <!-- custom css -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center py-5">
        <div class="row w-100 bg-white shadow-lg rounded rounded-4">
            <div class="col-lg-6 bg-dark text-white p-5 d-flex justify-content-center align-items-center flex-column">
                <h1 class="fw-bold mb-3">Welcome to our App</h1>
                <p class="text-white-50">Create a user Account </p>
                <img src="{% static 'images/back.jpg' %}" class="img-fluid rounded rounded-4 shadow"
                    style="max-height: 350px; object-fit: cover;" alt="">
            </div>
            <div class="col-lg-6">
                <div class="main">
                    <div>
                        <!-- From Uiverse.io by Yaya12085 -->
                        <form class="form" method="post" action="{% url 'register' %}">
                            {% csrf_token %}
                            <a href="{% url 'index' %}">
                                <h2 class="cross "><i class="fa-solid fa-circle-xmark"></i>
                                </h2>
                            </a>
                            <p class="title">Register </p>
                            <p class="message">Signup now and get full access to our app. </p>
                            <div class="flex">
                                <label>
                                    <input required="" placeholder="" name="fname" type="text" class="input">
                                    <span>Firstname</span>
                                </label>

                                <label>
                                    <input required="" placeholder="" name="lname" type="text" class="input">
                                    <span>Lastname</span>
                                </label>
                            </div>

                            <label>
                                <input required="" placeholder="" name="username" type="text" class="input">
                                <span>username</span>
                            </label>
                            <label>
                                <input required="" placeholder="" name="email" type="email" class="input">
                                <span>Email</span>
                            </label>

                            <label>
                                <input required="" id="password" placeholder="" name="password" type="password"
                                    class="input">
                                <span>Password</span>
                            </label>
                            <label>
                                <input required="" id="cpassword" placeholder="" name="cpassword" type="password"
                                    class="input">
                                <span>Confirm password</span>
                                <span id="password_match" style="color: red;  display: none;">password and Confirm
                                    password doesnot match</span>
                            </label>
                            <button class="submit">Submit</button>
                            <p class="signin">Already have an acount ? <a href="{% url 'log_in' %}">Signin</a> </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- bootsrap js cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- JavaScript -->
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>

    {% if messages %}
    {% for message in messages %}

    <script>
        alertify.set('notifier', 'position', 'top-right');

        const tag = "{{ message.tags }}";

        if (tag === "success") {
            alertify.success("{{ message|escapejs }}");
        } else if (tag === "error") {
            alertify.error("{{ message|escapejs }}");
        } else if (tag === "warning") {
            alertify.warning("{{ message|escapejs }}");
        } else {
            alertify.message("{{ message|escapejs }}");
        }
    </script>
    {% endfor %}
    {% endif %}

    <script>
        const passwordInput = document.getElementById('password')
        const cpasswordInput = document.getElementById('cpassword')
        const password_match = document.getElementById('password_match')

        cpasswordInput.addEventListener('input', function () {
            if (passwordInput.value != cpasswordInput.value) {
                password_match.style.display = 'inline'
            } else {
                password_match.style.display = 'none'
            }
        })
    </script>

</body>

</html>
